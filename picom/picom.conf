##################################################



#################################
#             Shadows           #
#################################
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

#################################
#   Transparency / Opacity      #
#################################
frame-opacity = 0.7;

#################################
#           Corners             #
#################################
corner-radius = 1;

#################################
#            Blur               #
#################################
blur-method ="dual_kawase";
blur-size = 1;
blur-deviation = 1;
blur-strength = 1;
blur-kern = "3x3box";

#################################
#       General Settings        #
#################################
backend = "glx"
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

rules: ({
    match = "class_g = 'Xfwm4'";
    blur-background = true;
    opacity = 0.70;
}, {
    match = "class_g = 'Xfce4-settings-manager'";
    blur-background = true;
    opacity = 0.85;
},{
    match = "class_g = 'org-springframework-boot-loader-PropertiesLauncher'";
    blur-background = true;
    opacity = 0.80;
}, {
    match = "class_g = 'steam'";
    blur-background = true;
    opacity = 0.80;
}, {
    match = "class_g = 'codeblocks'";
    blur-background = true;
    opacity = 0.80;
}, {
    match = "class_g = 'Chromium'";
    blur-background = true;
    opacity = 0.90;
}, {
    match = "class_g = 'xfce4-terminal'";
    blur-background = true;
    opacity = 0.70;
}, {
    match = "class_g = 'Xfce4-panel'";
    blur-background = true;
    opacity = 0.70;
},{
    match = "class_g = 'Xfce4-notifyd'";
    blur-background = true;
    opacity = 0.70;
}, {
    match = "class_g = 'discord'";
    blur-background = true;
    opacity = 0.75;
}, {
    match = "class_g = 'jetbrains-studio'";
    blur-background = true;
    opacity = 0.90;
}, {
    match = "class_g = 'Spotify'";
    blur-background = true;
    opacity = 0.75;
}, {
    match = "class_g = 'code'";
    blur_background = true;
    opacity = 0.85;
}, {
    match = "class_g = 'Thunar'";
    blur-background = true;
    opacity = 0.85;
}, {
    match = "class_g = 'firefox'";
    blur-background = true;
    opacity = 0.90;
}, {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.75;
    full-shadow = false;
}, {
    match = "window_type = 'dock'    || "
            "window_type = 'desktop' || "
            "_GTK_FRAME_EXTENTS@";
    blur-background = false;
}, {
    match = "window_type != 'dock'";
    # shader = "my_shader.frag";
}, {
    match = "window_type = 'dock' || "
          "window_type = 'desktop'";
    corner-radius = 0;
}, {
    match = "name = 'Notification'   || "
            "class_g = 'Conky'       || "
            "class_g ?= 'Notify-osd' || "
            "class_g = 'Cairo-clock' || "
            "_GTK_FRAME_EXTENTS@";
    shadow = false;
})
