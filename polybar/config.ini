[colors]
background = #1e1e2e
foreground = #cdd6f4
blue = #89b4fa
red = #f38ba8
green = #a6e3a1


[bar/main]
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}

font-0 = JetBrainsMono Nerd Font:size=14;2

modules-left = i3
modules-center = date
modules-right = network bluetooth notification memory volume battery power

cursor-click = pointer
enable-ipc = true


[module/i3]
type = internal/i3

format = <label-state>

ws-icon-0 = 1;󰈹 
ws-icon-1 = 2; 
ws-icon-2 = 3; 
ws-icon-3 = 4; 
ws-icon-4 = 5; 
ws-icon-5 = 6;󰫢 
ws-icon-6 = 7;󰫢 
ws-icon-7 = 8;󰫢 
ws-icon-8 = 9;󰫢 
ws-icon-9 = 10;󰫢 
ws-icon-default =  

label-focused = %name% %icon%
label-focused-background = ${colors.blue}
label-focused-foreground = ${colors.background}
label-focused-padding = 1

label-unfocused = %name% %icon%
label-unfocused-padding = 1

label-visible = %name% %icon%
label-visible-padding = 1

label-urgent = %name% %icon%
label-urgent-padding = 1


[module/date]
type = internal/date

interval = 1

date = %a-%d-%b-%H:%M

format-prefix ="󰥔 "
format-prefix-foreground = ${colors.blue}


[module/network]
type = custom/script

exec = ~/.config/polybar/scripts/wifi-status.sh
interval = 2

format = <label>
format-padding = 0

click-left = sh -c '~/.config/polybar/scripts/wifi-menu.sh'


[module/bluetooth]
type = custom/script

exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 2

format = <label>
format-padding = 0

click-left = blueman-manager


[module/volume]
type = internal/pulseaudio

format-volume =   <label-volume> |
format-muted = 󰖁 Muted |

label-volume = %percentage%


format-volume-padding = 0
format-muted-padding = 0


[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 5

format = <label>
format-padding = 0

[module/memory]
type = internal/memory

interval = 0.1

format = <label>
format-prefix = "  "
format-prefix-foreground = ${colors.primary}

label = %percentage_used%% |

[module/power]
type = custom/text

content = 
content-padding = 1


[module/notifications]
type = custom/script

exec = ~/.config/polybar/scripts/notifications.sh
interval = 1

format = <label>
format-padding = 0

click-left = ~/.config/polybar/scripts/notifications.sh toggle
click-right = ~/.config/polybar/scripts/notifications.sh clear
